name: Build
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Read versions
        id: props
        run: |
          echo "version=$(sed -n 's/^modVersion *= *//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "minecraftVersion=$(sed -n 's/^minecraftVersion *= *//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Execute Gradle build
        run: chmod +x ./gradlew && ./gradlew build
      - name: Print build outputs
        run: |
          echo "Minecraft version: ${{ steps.props.outputs.minecraftVersion }}"
          echo "Mod version: ${{ steps.props.outputs.version }}"
