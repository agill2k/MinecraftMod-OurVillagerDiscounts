name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    environment: Mod
    runs-on: ubuntu-latest
    # Required for softprops/action-gh-release to create the release;
    # GITHUB_TOKEN is read-only by default on newer repos and forks.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Read versions
        id: props
        run: |
          echo "version=$(sed -n 's/^modVersion *= *//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "minecraftVersion=$(sed -n 's/^minecraftVersion *= *//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew && ./gradlew build
          for f in build/libs/*.jar; do mv "$f" "${f%.jar}-fabric.jar"; done
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: "build/libs/our-villager-discounts-${{ steps.props.outputs.version }}-fabric.jar"
          name: "Fabric ${{ steps.props.outputs.version }}"
          fail_on_unmatched_files: true
      # Publishing to Modrinth and CurseForge is intentionally disabled.
      # Re-enable by uncommenting the block below (needs the Mod environment
      # plus MODRINTH_TOKEN / CF_API_TOKEN secrets).
